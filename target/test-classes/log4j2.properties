//name = PropertiesConfig


appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT

appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c - %msg%n


appender.file.type = File
appender.file.name = File

appender.file.fileName = ${sys:user.dir}/logs/mylog.log
appender.file.append = true

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c - %msg%n


logger.application.name = RestAssuredAPIFramework
logger.application.level = DEBUG
logger.application.additivity = false

logger.application.appenderRefs = console, file
logger.application.appenderRef.console.ref = Console
logger.application.appenderRef.file.ref = File


rootLogger.level = ERROR
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console